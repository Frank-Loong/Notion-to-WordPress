name: Quality checks

on:
  push:
    branches: [dev, dev-class, dev-frontend, main, master, integration]
  pull_request:
    branches: [dev, dev-class, dev-frontend, main, master, integration]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer audit --locked
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpcs
      - run: composer analyze
      - run: vendor/bin/phpunit

  node:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run build
      - run: npm run build:reproducible
      - run: npm run build:verify
