name: Release WordPress plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - name: Verify tag and package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./package.json').version\")"
      - run: npm run check
      - run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpcs && composer analyze && vendor/bin/phpunit
      - run: npm run build
      - run: npm run build:verify
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          files: |
            build/*.zip
            build/checksums.txt
